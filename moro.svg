<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="San Tommaso Moro">
  <!-- Ritratto stilizzato di San Tommaso Moro, ispirato al dipinto di Hans Holbein il Giovane (1527).
       © 2026 Fabio Santi, per la Sala San Tommaso Moro. -->
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D98A"/><stop offset=".55" stop-color="#D4AE4A"/><stop offset="1" stop-color="#A9801F"/>
    </linearGradient>
    <linearGradient id="pelle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2D7BE"/><stop offset="1" stop-color="#D9B395"/>
    </linearGradient>
    <linearGradient id="velluto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A0D17"/><stop offset=".5" stop-color="#8E1A2B"/><stop offset="1" stop-color="#5A0D17"/>
    </linearGradient>
    <clipPath id="tondo"><circle cx="60" cy="60" r="56"/></clipPath>
  </defs>
  <g clip-path="url(#tondo)">
    <circle cx="60" cy="60" r="56" fill="#0F2A2E"/>
    <circle cx="60" cy="60" r="56" fill="url(#oro)" opacity=".10"/>
    <!-- abito: maniche di velluto rosso e pelliccia scura -->
    <path d="M6 120 C10 96 26 86 44 82 L76 82 C94 86 110 96 114 120 Z" fill="url(#velluto)"/>
    <path d="M22 120 C26 100 36 90 48 86 L60 104 L72 86 C84 90 94 100 98 120 Z" fill="#2B1A12"/>
    <path d="M30 120 C33 104 41 95 50 91 L60 106 L70 91 C79 95 87 104 90 120" fill="none" stroke="#4A2F20" stroke-width="1.2" stroke-dasharray="2 2.5"/>
    <!-- collo e camicia -->
    <path d="M51 74 L51 84 L60 92 L69 84 L69 74 Z" fill="url(#pelle)"/>
    <path d="M50 83 L60 93 L70 83 L72 86 L60 98 L48 86 Z" fill="#F4EFE4"/>
    <!-- collana a S d'oro con la rosa Tudor -->
    <path d="M36 88 C44 100 52 106 60 108 C68 106 76 100 84 88" fill="none" stroke="url(#oro)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3.4 1.6"/>
    <circle cx="60" cy="110" r="4.2" fill="url(#oro)"/><circle cx="60" cy="110" r="1.8" fill="#8E1A2B"/>
    <!-- volto -->
    <path d="M44 50 C44 36 51 30 60 30 C69 30 76 36 76 50 C76 64 70 76 60 78 C50 76 44 64 44 50 Z" fill="url(#pelle)"/>
    <!-- barba appena accennata -->
    <path d="M47 60 C49 70 54 76 60 77.5 C66 76 71 70 73 60 C70 66 66 70 60 70.5 C54 70 50 66 47 60 Z" fill="#8C7462" opacity=".55"/>
    <!-- occhi, sopracciglia, naso, bocca -->
    <path d="M50 47.5 C52.5 46 55 46 57 47.5 M63 47.5 C65 46 67.5 46 70 47.5" fill="none" stroke="#5B4636" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="53.6" cy="51" rx="2.1" ry="1.3" fill="#3B2C22"/><ellipse cx="66.4" cy="51" rx="2.1" ry="1.3" fill="#3B2C22"/>
    <path d="M60 51 C59.4 56 58.6 59 57.6 60.6 C59 61.6 61 61.6 62.4 60.6" fill="none" stroke="#A8846A" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M55.6 66 C58.6 67.2 61.4 67.2 64.4 66" fill="none" stroke="#8A5E4D" stroke-width="1.3" stroke-linecap="round"/>
    <!-- orecchie e capelli corti sotto il berretto -->
    <ellipse cx="43.6" cy="53" rx="2.2" ry="4" fill="#D9B395"/><ellipse cx="76.4" cy="53" rx="2.2" ry="4" fill="#D9B395"/>
    <path d="M44.5 45 C44 49 44.3 52 45.2 55 L46.6 46 Z M75.5 45 C76 49 75.7 52 74.8 55 L73.4 46 Z" fill="#4A3A2E"/>
    <!-- berretto nero alla Tudor: più largo della testa, con le falde rivolte in fuori -->
    <path d="M35 51 L37.5 39.5 C39.5 28.5 48.5 23 60 23 C71.5 23 80.5 28.5 82.5 39.5 L85 51 C81.5 48 78.5 46 75.5 44.6 C71.5 42.4 66.5 41.2 60 41.2 C53.5 41.2 48.5 42.4 44.5 44.6 C41.5 46 38.5 48 35 51 Z" fill="#141414"/>
    <path d="M37.5 39.5 L44.5 44.6 M82.5 39.5 L75.5 44.6" stroke="#333" stroke-width="1"/>
    <path d="M44.5 44.6 C48.5 42.4 53.5 41.2 60 41.2 C66.5 41.2 71.5 42.4 75.5 44.6" fill="none" stroke="#2E2E2E" stroke-width="1.2"/>
    <path d="M41 33 C46 28.6 53 27.4 60 27.4 C67 27.4 74 28.6 79 33" fill="none" stroke="#2A2A2A" stroke-width=".9"/>
  </g>
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#oro)" stroke-width="3"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#oro)" stroke-width=".8" opacity=".6"/>
</svg>
