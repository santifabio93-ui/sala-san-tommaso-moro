# Il piano gratuito di Supabase mette in pausa i progetti inattivi per una settimana.
# Questa azione fa una piccola richiesta ogni 3 giorni per tenerlo attivo.
# Indirizzo e chiave pubblica si prendono da config.js (sono già pubblici); i "secrets" SUPABASE_URL e
# SUPABASE_ANON_KEY, se ci sono, hanno la precedenza.
name: Mantieni attivo Supabase
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Richiesta al database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${URL:-$(grep -oE 'supabaseUrl: *"[^"]+"' config.js | cut -d'"' -f2)}"
          KEY="${KEY:-$(grep -oE 'supabaseAnonKey: *"[^"]+"' config.js | cut -d'"' -f2)}"
          test -n "$URL" -a -n "$KEY" || { echo "Indirizzo o chiave mancanti in config.js"; exit 1; }
          # qualunque risposta del server va bene: conta che la richiesta arrivi al database
          code=$(curl -sS --retry 3 "$URL/rest/v1/settings?select=id&limit=1" -H "apikey: $KEY" -o /dev/null -w "%{http_code}")
          echo "HTTP $code"
          test "$code" != "000" -a "$code" -lt 500
