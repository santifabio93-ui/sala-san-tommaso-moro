<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I miei turni · Sala San Tommaso Moro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2629">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../style.css?v=2026-11-01.51">
<style>
.wrap { max-width: 640px }
.head { display: flex; gap: 12px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px }
.giorno { margin-top: 18px }
.giorno > .eyebrow { color: var(--accent); margin-bottom: 6px; display: block }
.fascia { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap }
.fascia + .fascia { margin-top: 8px }
.fascia.mia { border-color: var(--accent); background: var(--accent-soft) }
.fascia .t { font-weight: 700 }
.fascia .nomi { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px }
.fascia .nomi span { background: var(--sunk); border-radius: 999px; padding: 2px 9px; font-size: .82rem; font-weight: 600 }
.fascia.mia .nomi span.io { background: var(--accent); color: var(--accent-ink) }
.fascia .stato { font-size: .82rem; font-weight: 600; color: var(--muted); margin-top: 4px }
.fascia .stato.manca { color: var(--opz-fg) }
.fascia .stato.pieno { color: var(--ok-fg) }
.fascia .btn { flex: none }
.esito { text-align: center; padding: 30px 10px }
.cal-tutti { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 12px }
.cal-link { display: inline-block; margin-top: 6px; padding: 0; border: 0; background: none; font: inherit; font-size: .86rem; font-weight: 700; color: var(--accent); text-decoration: none; cursor: pointer }
.badge-btn { margin-top: 10px }
.badge-schermo { position: fixed; inset: 0; z-index: 90; background: rgba(10,20,22,.75); display: grid; place-items: center; padding: 16px }
.bs-carta { background: #fff; color: #13262A; border-radius: 18px; padding: 18px; width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center }
.bs-carta small { letter-spacing: .08em; text-transform: uppercase; color: #6b5a1c; font-weight: 700 } .bs-carta b { font-size: 1.4rem }
.bs-carta svg { max-width: 100%; height: auto } .bs-carta span { letter-spacing: .25em; font-weight: 700 }
.conta-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 12px; padding: 14px 16px; border-radius: var(--r); text-decoration: none; font-size: 1.05rem }
.conta-btn small { font-weight: 500; opacity: .85; font-size: .82rem }
.salva { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--gold-soft, #F6EDD0); border: 1px solid color-mix(in oklab, var(--gold, #C9A227) 35%, transparent); font-size: .9rem }

/* --- pagina dei turni, versione «smart» --- */
.ciao { margin-top: 4px; border-radius: 20px; padding: 18px 18px 16px; color: #F4F0E6; background: radial-gradient(500px 160px at 10% -30%, rgba(217,180,74,.25), transparent 60%), linear-gradient(135deg, var(--curtain-1, #0E2629), var(--curtain-2, #163A39) 55%, var(--curtain-3, #1E4A46)); box-shadow: 0 10px 30px rgba(14,38,41,.25) }
.ciao small { letter-spacing: .1em; text-transform: uppercase; color: rgba(244,240,230,.65); font-weight: 700; font-size: .72rem }
.ciao h2 { color: #fff; margin: 2px 0 6px; font-size: 1.6rem }
.ciao p { margin: 0; color: rgba(244,240,230,.9) } .ciao p b { color: #E9CF7E }
.ciao-az { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px }
.pill-az { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1); color: #fff; font: inherit; font-weight: 700; font-size: .9rem; text-decoration: none; cursor: pointer }
.miei { margin-top: 16px } .miei h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.miei-fila { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin-inline: -16px; padding: 2px 16px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch }
.miei-fila::-webkit-scrollbar { display: none }
.miei-fila .mio { flex: 0 0 min(84%, 360px); scroll-snap-align: start }
.miei-fila .mio:only-child { flex-basis: 100% }
.mio { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent) }
.mio-q { text-align: center; background: var(--surface); border-radius: 12px; padding: 8px 4px } .mio-q b { display: block; font-size: .92rem } .mio-q span { font-size: .75rem; color: var(--accent); font-weight: 700 }
.mio-c .t { font-weight: 800 }
.filtri { display: flex; gap: 6px; margin: 18px 0 6px; background: var(--sunk); padding: 4px; border-radius: 999px; width: fit-content }
.filtri button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer }
.filtri button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08) }
.filtri span { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--line); font-size: .75rem }
.filtri button.on span { background: var(--accent); color: #fff }
.giorni-strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 10px; scrollbar-width: none; scroll-snap-type: x proximity } .giorni-strip::-webkit-scrollbar { display: none }
.giorni-strip a { position: relative; flex: 0 0 auto; min-width: 54px; text-align: center; padding: 8px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); scroll-snap-align: start }
.giorni-strip a small { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700 } .giorni-strip a b { font-size: 1.2rem }
.giorni-strip a.c-me { border-color: var(--accent); background: var(--accent-soft) }
.giorni-strip .punto { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--due-fg) }
.giorno { margin-top: 14px; scroll-margin-top: 12px }
.evento { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-sm, none) }
.evento + .evento { margin-top: 10px } .evento.con-me { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)) }
.evento header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 12px 14px 8px } .evento header .t { font-weight: 800; font-size: 1.05rem }
.urgente { background: var(--due-bg); color: var(--due-fg); font-weight: 800; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap }
.fascia2 { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line) }
.fascia2.mia { background: color-mix(in oklab, var(--accent-soft) 70%, transparent) }
.f-ora { text-align: center; font-variant-numeric: tabular-nums } .f-ora b { display: block } .f-ora span { font-size: .78rem; color: var(--muted) }
.f-n { font-weight: 700; font-size: .92rem }
.avs { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 3px }
.av { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 11px; border-radius: 999px; font-size: .84rem; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 40%); line-height: 1.2 }
.av.io { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent) }
.av.vuoto { background: transparent; color: var(--muted); font-weight: 600; border: 2px dashed color-mix(in oklab, var(--muted) 55%, transparent); padding: 1px 11px }
.f-s { font-size: .78rem; font-weight: 700 } .f-s.manca { color: var(--opz-fg) } .f-s.ok { color: var(--ok-fg) }
.tb { border: 0; border-radius: 14px; padding: 12px 14px; font: inherit; font-weight: 800; cursor: pointer; white-space: nowrap; touch-action: manipulation }
.tb.ci-sono { background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 85%, #fff), var(--accent)); color: #fff; box-shadow: 0 4px 12px color-mix(in oklab, var(--accent) 30%, transparent) }
.tb.ci-sei { background: var(--surface); color: var(--accent); border: 2px solid var(--accent) }
.tb.togli { background: var(--due-bg); color: var(--due-fg); border: 2px solid var(--due-fg) }
.tb.ci-sono.anche { background: var(--surface); color: var(--accent); border: 2px solid color-mix(in oklab, var(--accent) 45%, transparent); box-shadow: none }
.tb:active { transform: scale(.97) }
.mio-az { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center }
.cambio-on { font-size: .82rem; font-weight: 800; color: var(--opz-fg); background: var(--opz-bg); padding: 2px 8px; border-radius: 999px }
.cercano { margin-top: 16px } .cercano h3 { margin: 0 0 8px }
.cerca { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 16px; background: var(--opz-bg); border: 1px solid color-mix(in oklab, var(--opz-fg) 30%, transparent) }
.cerca + .cerca { margin-top: 8px } .cerca .t { font-weight: 800 }
.f-cambio { font-size: .8rem; font-weight: 700; color: var(--opz-fg); margin: 2px 0 } .f-cambio button { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer }
.vuoto-t { text-align: center; padding: 26px 12px; color: var(--muted) }
.toast .annulla { margin-left: 10px; border: 0; background: none; color: #E9CF7E; font: inherit; font-weight: 800; cursor: pointer; text-decoration: underline }
@media (max-width: 380px) { .fascia2 { grid-template-columns: 46px minmax(0, 1fr) } .f-a { grid-column: 2 } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="seal ritratto" aria-hidden="true"><img src="../moro.svg" alt=""></div>
    <div><div class="eyebrow">Parrocchia di San Biagio · Piombino Dese</div><h1>Sala San Tommaso Moro</h1><span class="hint">Turni dei volontari</span></div>
  </div>
  <div id="app"><p class="muted">Caricamento dei turni…</p></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="../config.js?v=2026-11-01.51"></script>
<script type="module" src="turni.js?v=2026-11-01.51"></script>
</body>
</html>
