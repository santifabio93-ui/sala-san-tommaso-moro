<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Info per i social · Sala San Tommaso Moro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2629">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../style.css?v=2026-11-01.58">
<style>
.wrap { max-width: 760px }
.head { display: flex; gap: 12px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 14px }
.barra input { flex: 1; min-width: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); color: inherit; font: inherit }
.filtri { display: flex; gap: 6px; flex-wrap: wrap }
.filtri button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent) }
.mese { margin: 22px 0 8px; color: var(--accent) }
.ev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px }
.ev + .ev { margin-top: 12px }
.ev .loc { width: 110px; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, var(--curtain-2, #163A39), var(--curtain-3, #1E4A46)); display: flex; align-items: center; justify-content: center; color: #F4F0E6; font-size: 2rem }
.ev .loc img { width: 100%; height: 100%; object-fit: cover; display: block }
.ev h3 { margin: 2px 0 4px; font-size: 1.15rem }
.tipo { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--accent-soft); color: var(--accent) }
.tipo.sala { background: var(--gold-soft, #F6EDD0); color: #6b5a1c }
.date { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 }
.date span { padding: 3px 9px; border-radius: 8px; background: var(--sunk); font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums }
.date span.oggi { background: var(--accent); color: #fff }
dl.info { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 6px 0 0; font-size: .92rem }
dl.info dt { color: var(--muted); font-weight: 600 }
dl.info dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere }
.manca { color: var(--muted); font-style: italic }
.az { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px }
.nuovo { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #C9A227; color: #13262A; font-size: .7rem; font-weight: 800; vertical-align: middle }
.vuoto { text-align: center; padding: 26px 10px; color: var(--muted) }
@media (max-width: 480px) { .ev { grid-template-columns: 76px minmax(0, 1fr); gap: 10px } .ev .loc { width: 76px } dl.info { grid-template-columns: minmax(0, 1fr) } dl.info dt { margin-top: 4px } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="seal ritratto" aria-hidden="true"><img src="../moro.svg" alt=""></div>
    <div><div class="eyebrow">Parrocchia di San Biagio · Piombino Dese</div><h1>Sala San Tommaso Moro</h1><span class="hint">Info per i social</span></div>
  </div>
  <div id="app"><p class="muted">Caricamento degli eventi…</p></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="../config.js?v=2026-11-01.58"></script>
<script type="module" src="social.js?v=2026-11-01.58"></script>
</body>
</html>
